name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Cache PocketBase binary
        uses: actions/cache@v4
        with:
          path: .pb
          key: pocketbase-${{ runner.os }}-${{ hashFiles('scripts/test-pb.mjs') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (local PocketBase)
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
